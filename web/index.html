<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python Learn - Curso Interactivo Gratuito</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2431;--line:#2b3646;--txt:#e6edf3;--dim:#8b98a9;--cyan:#22d3ee;--green:#3fb950;--yel:#d29922;--pur:#a371f7;--red:#f85149}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
button{font-family:inherit;cursor:pointer}
#layout{display:flex;min-height:100vh}
aside{width:290px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px;border-bottom:1px solid var(--line);text-align:center}
.brand .logo{font-size:40px}
.brand h1{font-size:20px;color:var(--cyan);margin-top:4px}
.brand small{color:var(--dim);font-size:12px}
.hud{display:grid;grid-template-columns:repeat(3,1fr);padding:14px;background:var(--panel2);border-bottom:1px solid var(--line);text-align:center}
.hud b{display:block;font-size:18px;color:var(--cyan)}
.hud span{font-size:11px;color:var(--dim)}
#secList{flex:1;overflow-y:auto;padding:8px}
.sec{border-bottom:1px solid var(--line);padding:8px 10px}
.sec h3{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:6px 0}
.sec a{display:flex;gap:8px;align-items:center;padding:7px 9px;border-radius:6px;color:var(--txt);text-decoration:none;font-size:13px}
.sec a:hover{background:var(--panel2)}
.sec a.on{background:#1f6feb33;border-left:3px solid var(--cyan)}
.dot{width:9px;height:9px;border-radius:50%;background:#30363d;flex-shrink:0}
.dot.done{background:var(--green)}
.dot.proj{background:var(--yel)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
#top h2{font-size:18px;flex:1}
.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);padding:7px 13px;border-radius:7px;font-size:13px}
.ghost:hover{border-color:var(--cyan);color:var(--cyan)}
.bar{height:5px;background:var(--panel2)}
.bar div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .4s}
#body{flex:1;padding:22px;max-width:920px;width:100%;margin:0 auto}
.hero{text-align:center;padding:70px 20px}
.hero h2{font-size:38px;color:var(--cyan)}
.hero p{color:var(--dim);margin:10px 0}
.btn{background:linear-gradient(135deg,#22d3ee,#0ea5e9);border:0;color:#04222a;font-weight:700;padding:13px 34px;border-radius:10px;font-size:16px}
.btn:hover{filter:brightness(1.1)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{color:#fff;font-size:19px;margin-bottom:6px}
.card .desc{color:var(--dim);font-size:14px}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-learn{background:#1f4b7355;color:#58a6ff}
.b-prac{background:#2d6a3555;color:var(--green)}
.b-proj{background:#6b4a1455;color:var(--yel)}
pre{background:#010409;border:1px solid var(--line);border-radius:9px;padding:14px;overflow-x:auto;font-family:Consolas,Monaco,monospace;font-size:13px;color:#7ee787;line-height:1.6}
.ex{background:var(--panel2);border-left:3px solid var(--cyan);border-radius:0 9px 9px 0;padding:14px;margin:12px 0}
.ex .q{font-weight:600;margin-bottom:8px}
.ex .h{color:var(--dim);font-size:13px;margin-top:8px}
.ex .h b{color:var(--yel)}
textarea{width:100%;background:#010409;color:#7ee787;border:1px solid var(--line);border-radius:8px;padding:11px;font-family:Consolas,Monaco,monospace;font-size:13px;min-height:70px;resize:vertical}
textarea:focus{outline:none;border-color:var(--cyan)}
.row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.ok{color:var(--green);font-weight:600;margin-top:8px}
.no{color:var(--red);font-weight:600;margin-top:8px}
.nav{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.tcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:15px;text-align:center}
.tcard:hover{border-color:var(--cyan)}
.tcard.ok{border-color:var(--green)}
.tcard .n{font-size:19px;font-weight:700;color:var(--cyan)}
.tcard.ok .n{color:var(--green)}
.tcard .t{font-size:12px;color:var(--dim);margin-top:5px}
.gridlessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px}
.lcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:15px;text-align:center}
.lcard:hover{border-color:var(--cyan)}
.lcard .n{font-size:22px;font-weight:700;color:var(--cyan)}
.lcard .t{font-size:12px;color:var(--dim);margin:5px 0}
.cert{text-align:center;padding:44px;background:linear-gradient(135deg,#161b22,#1f2937);border:2px solid var(--yel);border-radius:14px}
.cert h2{color:var(--yel);font-size:28px}
.cert p{color:var(--dim);margin:9px 0}
@media(max-width:800px){#layout{flex-direction:column}aside{width:100%;height:auto;position:relative}#secList{max-height:210px}#body{padding:15px}.hero h2{font-size:27px}}
</style>
</head>
<body>
<div id="layout">
<aside>
  <div class="brand">
    <div class="logo">&#128045;</div>
    <h1>Python Learn</h1>
    <small>Curso interactivo gratuito</small>
  </div>
  <div class="hud">
    <div><b id="hScore">0</b><span>&#11088; Puntos</span></div>
    <div><b id="hDone">0</b><span>&#128218; Temas</span></div>
    <div><b id="hStreak">0</b><span>&#128293; Racha</span></div>
  </div>
  <div id="secList"></div>
</aside>
<main>
  <div id="top">
    <button class="ghost" onclick="goHome()">&#127968; Inicio</button>
    <h2 id="ttl">Python Learn</h2>
    <button class="ghost" onclick="showCert()">&#127942; Certificado</button>
  </div>
  <div class="bar"><div id="pfill" style="width:0%"></div></div>
  <div id="body"></div>
</main>
</div>
<script>
var COURSE = {"1": {"title": "Creating variables", "exercises": [{"question": "Create a variable 'name' with your name and print it", "answer": "name = \"Ana\"\nprint(name)", "hint": "Use assignment and print()"}], "topics": [{"title": "Nombres de variables", "description": "Elige nombres descriptivos para tus variables", "exercises": [{"question": "name = \"Ana\"\nprint(name)", "answer": "Use meaningful variable names", "hint": "Follow Python naming rules"}]}, {"title": "Valores de variables", "description": "Asigna diferentes tipos de datos", "exercises": [{"question": "age = 25\nheight = 1.70\nprint(age, height)", "answer": "Assign int, float, string", "hint": "Each variable holds one value"}]}, {"title": "Consola", "description": "Usa print() para mostrar valores", "exercises": [{"question": "print(\"Hello World\")", "answer": "Use print() function", "hint": "Text must be inside quotes"}]}]}, "2": {"title": "Using variables", "exercises": [{"question": "Create a=5 and b=3, print sum and difference", "answer": "a = 5\nb = 3\nprint(a + b)\nprint(a - b)", "hint": "Assign then use + and -"}], "topics": [{"title": "Operaciones con variables", "description": "Suma, resta, multiplica y divide", "exercises": [{"question": "a = 10\nb = 3\nprint(a + b, a - b, a * b, a / b)", "answer": "Use + - * / operators", "hint": "Operators work like math"}]}, {"title": "Reasignación", "description": "Cambia el valor de una variable", "exercises": [{"question": "x = 5\nx = 10\nprint(x)", "answer": "Just assign a new value", "hint": "Variables can change"}]}]}, "3": {"title": "True and False", "exercises": [{"question": "Create a boolean 'is_raining' and print it", "answer": "is_raining = True\nprint(is_raining)", "hint": "Use True or False"}], "topics": [{"title": "Verdadero y falso", "description": "Entiende los valores booleanos", "exercises": [{"question": "is_active = True\nprint(is_active)", "answer": "Use True or False (capital)", "hint": "Only two possible values"}]}, {"title": "Comparaciones booleanas", "description": "Compara valores para obtener True/False", "exercises": [{"question": "print(5 > 3)\nprint(5 == 5)\nprint(5 != 3)", "answer": "Use >, ==, != operators", "hint": "Comparison returns True or False"}]}]}, "4": {"title": "Equality and verification", "exercises": [{"question": "Check if 10 equals 10", "answer": "print(10 == 10)", "hint": "Use == for equality"}], "topics": [{"title": "Igualdad", "description": "Compara si dos valores son iguales", "exercises": [{"question": "print(10 == 10)\nprint(10 == 5)", "answer": "Use == for equality", "hint": "Double equals sign"}]}, {"title": "Desigualdad", "description": "Compara si valores son diferentes", "exercises": [{"question": "print(10 != 5)\nprint(10 != 10)", "answer": "Use != for inequality", "hint": "Not equal operator"}]}, {"title": "Mayor y menor", "description": "Compara tamaño de valores", "exercises": [{"question": "print(5 > 3)\nprint(3 < 5)\nprint(5 >= 5)", "answer": "Use >, <, >=, <=", "hint": "Greater than, less than operators"}]}]}, "5": {"title": "Format strings", "exercises": [{"question": "Create fruit variable, print 'I love <fruit>'", "answer": "fruit = \"apple\"\nprint(f\"I love {fruit}\")", "hint": "Use f-string"}], "topics": [{"title": "F-strings", "description": "Inserta variables dentro de texto", "exercises": [{"question": "name = \"Ana\"\nprint(f\"Hello {name}\")", "answer": "Use f before the string", "hint": "Curly braces {} hold variables"}]}, {"title": "Métodos de texto", "description": "Transforma strings con métodos", "exercises": [{"question": "text = \"hello\"\nprint(text.upper())\nprint(text.capitalize())", "answer": "Use .upper(), .lower(), .capitalize()", "hint": "Methods come after dot"}]}]}, "6": {"title": "Python basics", "exercises": [{"question": "Create name, age, city and print formatted", "answer": "name = \"Ana\"\nage = 25\ncity = \"Lima\"\nprint(f\"I am {name}, {age} from {city}\")", "hint": "Use f-strings"}], "type": "PRACTICE", "topics": [{"title": "Tipos de datos", "description": "Identifica int, float, bool, str", "exercises": [{"question": "print(type(10))\nprint(type(3.14))\nprint(type(True))\nprint(type(\"text\"))", "answer": "Use type() function", "hint": "Each type is different"}]}, {"title": "Conversiones", "description": "Convierte entre tipos de datos", "exercises": [{"question": "print(int(\"5\"))\nprint(float(3))\nprint(str(10))", "answer": "Use int(), float(), str()", "hint": "Convert between types"}]}, {"title": "Consolidación", "description": "Practica todos los conceptos básicos", "exercises": [{"question": "name = \"Ana\"\nage = 25\nprint(f\"{name} is {age}\")", "answer": "Combine all concepts", "hint": "Practice makes perfect"}]}]}, "7": {"title": "Bot - Part 1", "exercises": [{"question": "Build a bot that greets the user", "answer": "name = input(\"What is your name? \")\nprint(f\"Hello, {name}! Nice to meet you!\")\nprint(\"I am your Python bot. How can I help?\")", "hint": "Use input() and f-string"}], "type": "PROJECT_GUIDED", "project_part": 1, "project_code": "print('Bot: Hello!')\nname = input('Bot: What is your name? ')\nprint(f'Bot: Nice to meet you, {name}!')\nprint('I am your Python bot. How can I help?')\n", "topics": [{"title": "Saludo del bot", "description": "Crea un bot que saluda", "exercises": [{"question": "name = input(\"What is your name? \")\nprint(f\"Hello, {name}!\")", "answer": "Use input() and f-string", "hint": "input() gets user text"}]}, {"title": "Interacción básica", "description": "Haz que el bot responda", "exercises": [{"question": "name = input(\"Name: \")\nprint(f\"Nice to meet you, {name}!\")\nprint(\"I am your Python bot.\")", "answer": "Multiple print() calls", "hint": "Build a conversation flow"}]}]}, "8": {"title": "Comparing numbers", "exercises": [{"question": "Check if number is positive, negative, or zero", "answer": "num = int(input(\"Num: \"))\nif num > 0:\n    print(\"Positive\")\nelif num < 0:\n    print(\"Negative\")\nelse:\n    print(\"Zero\")", "hint": "Use if/elif/else"}]}, "9": {"title": "Comparing strings", "exercises": [{"question": "Ask for name, check if 'Ana'", "answer": "name = input(\"Your name: \")\nif name.lower() == \"ana\":\n    print(\"Hello Ana!\")\nelse:\n    print(f\"Hello {name}!\")", "hint": "Use .lower()"}]}, "10": {"title": "Discovering types", "exercises": [{"question": "Create vars of each type and print types", "answer": "x=10; y=\"hello\"; z=3.14; w=True\nprint(type(x)); print(type(y)); print(type(z)); print(type(w))", "hint": "Use type() function"}]}, "11": {"title": "Types and comparisons", "exercises": [{"question": "Ask two numbers, convert, print larger", "answer": "a = int(input(\"First: \")); b = int(input(\"Second: \"))\nif a > b: print(f\"{a} larger\")\nelif b > a: print(f\"{b} larger\")\nelse: print(\"Equal\")", "hint": "Use int() to convert"}], "type": "PRACTICE"}, "12": {"title": "Input", "exercises": [{"question": "Ask name and age, print greeting", "answer": "name = input(\"Your name: \")\nage = int(input(\"Your age: \"))\nprint(f\"Hello {name}! You are {age}.\"", "hint": "Use input() and f-string"}]}, "13": {"title": "Bot - Part 2", "exercises": [{"question": "Build interactive bot conversation", "answer": "print(\"Bot: Hello!\")\nname = input(\"Bot: What is your name? \")\nprint(f\"Bot: Nice to meet you, {name}!\")\nmood = input(\"Bot: How are you? \")\nif mood.lower() == \"good\":\n    print(\"Bot: Great!\")\nelse:\n    print(\"Bot: Hope you feel better!\")\nprint(f\"Bot: Goodbye {name}!\")", "hint": "Use input() and if/else"}], "type": "PROJECT_GUIDED", "project_part": 2, "project_code": "print('Bot: Hello!')\nname = input('Bot: What is your name? ')\nprint(f'Bot: Nice to meet you, {name}!')\nmood = input('Bot: How are you? ')\nif mood.lower() == 'good':\n    print('Bot: Great!')\nelse:\n    print('Bot: Hope you feel better!')\nprint(f'Bot: Goodbye {name}!')\n"}, "14": {"title": "Decision making", "exercises": [{"question": "Check if number is even or odd", "answer": "num = int(input(\"Num: \"))\nif num % 2 == 0:\n    print(\"Even\")\nelse:\n    print(\"Odd\")", "hint": "Use % modulo"}]}, "15": {"title": "Using conditions", "exercises": [{"question": "Check multiple criteria", "answer": "age = int(input(\"Age: \"))\nif age >= 18 and age < 65:\n    print(\"Working adult\")\nelif age >= 65:\n    print(\"Senior\")\nelse:\n    print(\"Minor\")", "hint": "Use and/or"}]}, "16": {"title": "Conditional statements 1", "exercises": [{"question": "Write access level checker", "answer": "level = input(\"Level (admin/user): \")\nif level.lower() == \"admin\":\n    print(\"Full access\")\nelse:\n    print(\"Limited access\")", "hint": "Use if/else with strings"}], "type": "PRACTICE"}, "17": {"title": "Coding Else statements", "exercises": [{"question": "Create calculator with if/elif/else", "answer": "op = input(\"Op (+,-,*,/): \")\na = float(input(\"A: \")); b = float(input(\"B: \"))\nif op == \"+\": print(a+b)\nelif op == \"-\": print(a-b)\nelif op == \"*\": print(a*b)\nelse: print(a/b)", "hint": "Chain if/elif/else"}]}, "18": {"title": "Adding Elif", "exercises": [{"question": "Create grading system", "answer": "score = int(input(\"Score: \"))\nif score >= 90: print(\"A\")\nelif score >= 80: print(\"B\")\nelif score >= 70: print(\"C\")\nelse: print(\"F\")", "hint": "Use elif for ranges"}]}, "19": {"title": "Using complex decisions", "exercises": [{"question": "Combine and/or/not", "answer": "temp = int(input(\"Temp: \")); rain = input(\"Rain? (yes/no): \")\nif temp > 30 and rain.lower() != \"yes\":\n    print(\"Hot and sunny!\")\nelif temp < 10 or rain.lower() == \"yes\":\n    print(\"Cold or rainy\")\nelse:\n    print(\"Pleasant\")", "hint": "Combine and/or/not"}]}, "20": {"title": "Conditional statements 2", "exercises": [{"question": "Create login checker", "answer": "user = input(\"Username: \"); p = input(\"Password: \")\nif user == \"admin\" and p == \"1234\":\n    print(\"Access granted\")\nelse:\n    print(\"Access denied\")", "hint": "Combine checks"}], "type": "PRACTICE"}, "21": {"title": "Rock Paper Scissors - Part 1", "exercises": [{"question": "Build RPS game logic", "answer": "import random\noptions = [\"rock\",\"paper\",\"scissors\"]\npc = random.choice(options)\nyou = input(\"rock/paper/scissors: \")\nprint(f\"PC: {pc}\")\nif you == pc: print(\"Tie!\")\nelif (you==\"rock\" and pc==\"scissors\") or (you==\"paper\" and pc==\"rock\") or (you==\"scissors\" and pc==\"paper\"):\n    print(\"You win!\")\nelse: print(\"PC wins!\")", "hint": "Use random.choice() and if/elif"}], "type": "PROJECT_GUIDED", "project_part": 1, "project_code": "import random\noptions = ['rock','paper','scissors']\npc = random.choice(options)\nyou = input('rock/paper/scissors: ')\nprint(f'PC: {pc}')\nif you == pc: print('Tie!')\nelif (you=='rock' and pc=='scissors') or (you=='paper' and pc=='rock') or (you=='scissors' and pc=='paper'):\n    print('You win!')\nelse: print('PC wins!')\n"}, "22": {"title": "Auto-assignment and operators", "exercises": [{"question": "Use +=, -=, *=", "answer": "x = 10\nx += 5\nx -= 3\nx *= 2\nprint(x)", "hint": "Use += -= *= operators"}]}, "23": {"title": "While loops", "exercises": [{"question": "Count from 1 to 5", "answer": "i = 1\nwhile i <= 5:\n    print(i)\n    i += 1", "hint": "Use while with counter"}]}, "24": {"title": "Stopping while loops", "exercises": [{"question": "Use break to stop early", "answer": "while True:\n    cmd = input(\"Enter (quit to stop): \")\n    if cmd == \"quit\": break\n    print(f\"You said: {cmd}\")\nprint(\"Loop stopped!\")", "hint": "Use break statement"}]}, "25": {"title": "Loops 1", "exercises": [{"question": "Sum 1 to 10 using while", "answer": "s = 0; i = 1\nwhile i <= 10:\n    s += i; i += 1\nprint(f\"Sum: {s}\")", "hint": "Use while and +="}], "type": "PRACTICE"}, "26": {"title": "While loop control", "exercises": [{"question": "Use continue and break", "answer": "i = 0\nwhile i < 10:\n    i += 1\n    if i % 2 == 0: conti Create file reader with error handling", "answer": "def read_number(filename):\n    try:\n        with open(filename) as f:\n            return float(f.read().strip())\n    except FileNotFoundError:\n        print(\"File missing\")\n    except ValueError:\n        print(\"Not a number\")\n    return None\nprint(read_number(\"data.txt\"))", "hint": "Use try/except/finally with files"}], "type": "PRACTICE"}, "88": {"title": "Best practices in exception handling", "exercises": [{"question": "Follow best practices", "answer": "# Be specific with exception types\n# Never use bare except:\n# Use finally for cleanup", "hint": "Best practice patterns"}]}, "89": {"title": "Exceptions", "exercises": [{"question": "Create a robust calculator", "answer": "def calc(a, b, op):\n    try:\n        a, b = float(a), float(b)\n        if op == \"+\": return a+b\n        elif op == \"-\": return a-b\n        elif op == \"*\": return a*b\n        elif op == \"/\":\n            if b==0: raise ZeroDivisionError\n            return a/b\n        else: raise ValueError(f\"Unknown op: {op}\")\n    except (ValueError, ZeroDivisionError) as e:\n        return f\"Error: {e}\"\nprint(calc(10, 5, \"+\"))\nprint(calc(10, 0, \"/\"))", "hint": "Combine all error handling"}], "type": "PRACTICE"}, "90": {"title": "Sensor Reading Validator - Part 1", "exercises": [{"question": "Validate sensor readings", "answer": "import random\nclass InvalidReadingError(Exception):\n    pass\ndef read_sensor():\n    val = random.uniform(-10, 50)\n    if val < 0 or val > 40: raise InvalidReadingError(f\"Invalid reading: {val}\")\n    return val\nreadings = []\nfor i in range(10):\n    try:\n        r = read_sensor()\n        readings.append(r)\n        print(f\"Reading {i+1}: {r:.2f}\")\n    except InvalidReadingError as e: print(f\"Error: {e}\")\nif readings: print(f\"Valid readings: {len(readings)}/10\")", "hint": "Use custom exceptions and loops"}], "type": "PROJECT_GUIDED", "project_part": 1, "project_code": "import random\nclass InvalidReadingError(Exception):\n    pass\ndef read_sensor():\n    val = random.uniform(-10, 50)\n    if val < 0 or val > 40: raise InvalidReadingError(f'Invalid reading: {val}')\n    return val\nreadings = []\nfor i in range(10):\n    try:\n        r = read_sensor()\n        readings.append(r)\n        print(f'Reading {i+1}: {r:.2f}')\n    except InvalidReadingError as e: print(f'Error: {e}')\nif readings: print(f'Valid readings: {len(readings)}/10')\n"}};
var SECS = [{"k": "learn", "n": "Nombres de variables", "ls": ["1", "2", "3", "4", "5", "6"]}, {"k": "project", "n": "Saludo del bot", "ls": ["7"]}, {"k": "learn", "n": "Comparing numbers", "ls": ["8", "9", "10", "11", "12"]}, {"k": "project", "n": "Bot - Part 2", "ls": ["13"]}, {"k": "learn", "n": "Decision making", "ls": ["14", "15", "16", "17", "18", "19", "20"]}, {"k": "project", "n": "Rock Paper Scissors - Part 1", "ls": ["21"]}, {"k": "learn", "n": "Auto-assignment and operators", "ls": ["22", "23", "24", "25", "26", "27", "28", "29", "30"]}, {"k": "project", "n": "Rock Paper Scissors - Part 2", "ls": ["31"]}, {"k": "learn", "n": "Grouping data in lists", "ls": ["32", "33", "34", "35", "36", "37", "38"]}, {"k": "project", "n": "To-Do List - Part 1", "ls": ["39"]}, {"k": "learn", "n": "Finding extreme data", "ls": ["40", "41", "42", "43", "44", "45"]}, {"k": "project", "n": "To-Do List - Part 2", "ls": ["46"]}, {"k": "learn", "n": "Reusing code with functions", "ls": ["47", "48", "49", "50", "51", "52"]}, {"k": "project", "n": "Food Ordering System - Part 1", "ls": ["53"]}, {"k": "learn", "n": "Functions and variable scope", "ls": ["54", "55", "56", "57", "58"]}, {"k": "project", "n": "Food Ordering System - Part 2", "ls": ["59"]}, {"k": "learn", "n": "Creating tuples", "ls": ["60", "61", "62", "63", "64", "65"]}, {"k": "project", "n": "Draw a Card - Part 1", "ls": ["66"]}, {"k": "learn", "n": "Creating sets", "ls": ["67", "68", "69", "70"]}, {"k": "project", "n": "Draw a Card - Part 2", "ls": ["71"]}, {"k": "learn", "n": "Modules", "ls": ["72", "73", "74", "75", "76", "77", "78", "79", "80"]}, {"k": "project", "n": "Damage Calculator - Part 1", "ls": ["81"]}, {"k": "learn", "n": "Errors and exceptions", "ls": ["82", "83", "84", "85", "86", "87", "88", "89"]}, {"k": "project", "n": "Sensor Reading Validator - Part 1", "ls": ["90"]}];
var S = {done:[],score:0,streak:0};

function loadS(){try{var s=localStorage.getItem('pl_v1');if(s)S=JSON.parse(s);}catch(e){}}
function saveS(){try{localStorage.setItem('pl_v1',JSON.stringify(S));}catch(e){}}
function topicsOf(l){return (l.topics&&l.topics.length)?l.topics:[{title:l.title,description:'',exercises:l.exercises||[]}];}
function allItems(){var o=[];Object.keys(COURSE).sort(function(a,b){return a-b;}).forEach(function(id){topicsOf(COURSE[id]).forEach(function(t,i){o.push({lid:id,tid:i,lesson:COURSE[id],topic:t});});});return o;}
function key(lid,tid){return lid+'_'+tid;}
function badge(l){if(l.type==='PROJECT_GUIDED')return '<span class="badge b-proj">Proyecto guiado</span>';if(l.type==='PRACTICE')return '<span class="badge b-prac">Practica</span>';return '<span class="badge b-learn">Aprende</span>';}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function hud(){document.getElementById('hScore').textContent=S.score;document.getElementById('hStreak').textContent=S.streak;document.getElementById('hDone').textContent=S.done.length+'/'+allItems().length;document.getElementById('pfill').style.width=(S.done.length/allItems().length*100)+'%';}

function nav(){
  var h='';
  SECS.forEach(function(sec){
    var n=0;sec.ls.forEach(function(id){n+=topicsOf(COURSE[id]).length;});
    var dn=0;sec.ls.forEach(function(id){topicsOf(COURSE[id]).forEach(function(t,i){if(S.done.indexOf(key(id,i))>-1)dn++;});});
    h+='<div class="sec"><h3>'+(dn===n?'&#10004; ':'')+esc(sec.n)+' ('+dn+'/'+n+')</h3>';
    sec.ls.forEach(function(id){
      var l=COURSE[id],t=topicsOf(l);
      var d=t.every(function(x,i){return S.done.indexOf(key(id,i))>-1;});
      h+='<a href="#" data-g="l" data-id="'+id+'"><span class="dot'+(d?' done':'')+(l.type==='PROJECT_GUIDED'?' proj':'')+'"></span><span>'+id+'. '+esc(l.title)+'</span></a>';
    });
    h+='</div>';
  });
  document.getElementById('secList').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('#secList a'),function(a){
    a.onclick=function(e){e.preventDefault();showLesson(a.dataset.id);};
  });
}

function goHome(){
  document.getElementById('ttl').textContent='Python Learn';
  var n=allItems().length,p=S.done.length,r=Math.round(p/n*100);
  document.getElementById('body').innerHTML =
   '<div class="hero"><div class="logo" style="font-size:64px">&#128045;</div>'+
   '<h2>Python Learn</h2><p>Curso interactivo de Python, gratis y en tu navegador</p>'+
   '<p style="color:#22d3ee;font-weight:600">'+n+' temas &middot; 14 proyectos &middot; 100% gratis</p>'+
   '<br><button class="btn" onclick="nextTopic()">&#9654; Empezar a aprender</button>'+
   (p? '<p style="margin-top:18px;font-size:14px">Progreso: '+p+'/'+n+' ('+r+'%)</p>':'')+
   '<p style="margin-top:26px;font-size:12px;color:#6e7b8c">Inspirado en Mimo &middot; offline, sin servidor</p></div>';
  nav();hud();
}

function nextTopic(){
  var it=allItems(),n=S.done.length;
  for(var i=0;i<it.length;i++){if(S.done.indexOf(key(it[i].lid,it[i].tid))===-1){showTopic(it[i].lid,it[i].tid);return;}}
  showCert();
}

function showLesson(id){
  var l=COURSE[id],t=topicsOf(l);
  document.getElementById('ttl').textContent=l.title;
  var h='<div class="card"><h3>'+id+'. '+esc(l.title)+'</h3><div class="desc">'+badge(l)+'</div>'+
        (l.project_code?'<p style="color:#8b98a9;font-size:14px;margin-top:10px">'+esc(l.project_code.split('\n')[0])+'</p>':'')+'</div><div class="grid">';
  t.forEach(function(x,i){
    var d=S.done.indexOf(key(id,i))>-1;
    h+='<div class="tcard'+(d?' ok':'')+'" onclick="showTopic('+id+','+i+')"><div class="n">'+(d?'&#10004;':(i+1))+'</div><div class="t">'+esc(x.title)+'</div></div>';
  });
  h+='</div><div class="nav"><button class="btn" onclick="nextTopic()">Continuar &#9654;</button><button class="ghost" onclick="goHome()">Inicio</button></div>';
  document.getElementById('body').innerHTML=h;nav();hud();
}

function showTopic(lid,tid){
  var l=COURSE[lid],t=topicsOf(l)[tid];
  document.getElementById('ttl').textContent=t.title;
  var h='<div class="card"><h3>'+esc(t.title)+'</h3><div class="desc">'+badge(l)+' &middot; Leccion '+lid+', tema '+(tid+1)+'</div>'+
        (t.description?'<p style="color:#8b98a9;font-size:14px;margin-top:10px">'+esc(t.description)+'</p>':'')+
        (l.project_code?'<pre>'+esc(l.project_code)+'</pre>':'')+'</div>';
  (t.exercises||[]).forEach(function(ex,i){
    h+='<div class="ex"><div class="q">Ejercicio '+(i+1)+'</div><pre>'+esc(ex.question)+'</pre>'+
       '<div class="h"><b>Pista:</b> '+esc(ex.hint)+'</div>'+
       '<textarea id="ta'+i+'" placeholder="Escribe tu codigo Python aqui..."></textarea>'+
       '<div class="row"><button class="btn" onclick="check('+lid+','+tid+','+i+')">Comprobar</button>'+
       '<button class="ghost" onclick="reveal('+lid+','+tid+','+i+')">Ver respuesta</button></div>'+
       '<div id="fb'+i+'"></div></div>';
  });
  h+='<div class="nav">';
  if(tid>0)h+='<button class="ghost" onclick="showTopic('+lid+','+(tid-1)+')">&#8592; Tema anterior</button>';
  h+='<button class="btn" onclick="afterTopic('+lid+','+tid+')">Marcar tema y continuar &#9654;</button></div>';
  document.getElementById('body').innerHTML=h;nav();hud();
  document.getElementById('body').scrollTop=0;
}

function norm(s){
  return String(s).replace(/\s+/g,' ')
    .replace(/["']/g,'"')
    .replace(/\bprint\s*\(/g,'print(')
    .replace(/\)\s*$/,'')
    .trim().toLowerCase();
}
function keywords(s){
  return String(s).replace(/["']/g,' ').replace(/[^a-zA-Z0-9_ ]/g,' ').split(/\s+/).filter(function(w){return w.length>2;});
}

function check(lid,tid,i){
  var t=topicsOf(COURSE[lid])[tid],ex=t.exercises[i];
  var user=document.getElementById('ta'+i).value;
  var fb=document.getElementById('fb'+i);
  if(!user.trim()){fb.innerHTML='<div class="no">Escribe algo primero</div>';return;}
  var a=norm(ex.answer),b=norm(user);
  var kw=keywords(ex.answer),uw=keywords(user);
  var hit=kw.filter(function(w){return uw.indexOf(w)>-1;}).length;
  var good=(a===b)||(a.indexOf(b)===0&&b.length>6)||(hit>=Math.max(1,Math.ceil(kw.length*0.7)));
  if(good){
    fb.innerHTML='<div class="ok">&#10004; Correcto! +5 puntos</div>';
    var k=key(lid,tid);
    if(S.done.indexOf(k)===-1){S.done.push(k);S.score+=5;S.streak++;saveS();}
  }else{
    fb.innerHTML='<div class="no">&#10007; Casi. Revisa la pista e intentalo de nuevo.</div>';
  }
  nav();hud();
}

function reveal(lid,tid,i){
  var t=topicsOf(COURSE[lid])[tid],ex=t.exercises[i];
  document.getElementById('fb'+i).innerHTML='<div class="h" style="margin-top:10px"><b>Respuesta:</b></div><pre>'+esc(ex.answer)+'</pre>';
}

function afterTopic(lid,tid){
  var k=key(lid,tid);
  if(S.done.indexOf(k)===-1){S.done.push(k);S.score+=5;S.streak++;saveS();}
  var t=topicsOf(COURSE[lid]);
  if(tid+1<t.length){showTopic(lid,tid+1);return;}
  var ids=Object.keys(COURSE).sort(function(a,b){return a-b;});
  var p=ids.indexOf(String(lid));
  if(p>-1&&p+1<ids.length){showLesson(ids[p+1]);return;}
  showCert();
}

function showCert(){
  var it=allItems(),n=it.length,p=S.done.length;
  if(p<n){
    document.getElementById('ttl').textContent='Certificado';
    document.getElementById('body').innerHTML='<div class="cert"><h2>&#128942; Todavia no</h2><p>Completa los '+n+' temas para obtener tu certificado</p><p style="color:#22d3ee;font-size:22px;font-weight:700">'+p+' / '+n+' ('+Math.round(p/n*100)+'%)</p><div class="nav" style="justify-content:center"><button class="btn" onclick="nextTopic()">Continuar aprendiendo</button></div></div>';
    nav();hud();return;
  }
  document.getElementById('ttl').textContent='Certificado';
  var d=new Date().toLocaleDateString('es');
  document.getElementById('body').innerHTML='<div class="cert"><div style="font-size:56px">&#127942;</div><h2>Certificado de Finalizacion</h2><p>Se otorga a</p><h2 style="font-size:24px;color:#fff;margin:12px 0">&#128100; Crico719</h2><p>por completar el curso de <b style="color:#22d3ee">Python Learn</b></p><p>'+n+' temas &middot; 14 proyectos &middot; '+d+'</p><p style="margin-top:18px;font-size:12px">Puntaje final: '+S.score+' puntos</p><div class="nav" style="justify-content:center"><button class="ghost" onclick="resetAll()">Reiniciar progreso</button></div></div>';
  nav();hud();
}

function resetAll(){
  if(confirm('Borrar todo tu progreso?')){S={done:[],score:0,streak:0};saveS();goHome();}
}

loadS();goHome();
</script>
