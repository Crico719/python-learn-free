/* ---------- markdown -> html ---------- */
function md(src){
  var out=[],lines=String(src).split('\n'),i=0;
  while(i<lines.length){
    var L=lines[i];
    if(/^```/.test(L)){
      var lang=L.slice(3).trim(),buf=[],i2=i+1;
      while(i2<lines.length&&!/^```/.test(lines[i2])){buf.push(lines[i2]);i2++;}
      out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');i=i2+1;continue;
    }
    if(/^###\s/.test(L)){out.push('<h3>'+mdIn(L.replace(/^###\s/,''))+'</h3>');i++;continue;}
    if(/^##\s/.test(L)){out.push('<h2>'+mdIn(L.replace(/^##\s/,''))+'</h2>');i++;continue;}
    if(/^#\s/.test(L)){out.push('<h2>'+mdIn(L.replace(/^#\s/,''))+'</h2>');i++;continue;}
    if(/^\|/.test(L)){
      var rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i]);i++;}
      var h='<table><thead><tr>';
      rows[0].split('|').slice(1,-1).forEach(function(c){h+='<th>'+mdIn(c.trim())+'</th>';});
      h+='</tr></thead><tbody>';
      for(var r=2;r<rows.length;r++){h+='<tr>';rows[r].split('|').slice(1,-1).forEach(function(c){h+='<td>'+mdIn(c.trim())+'</td>';});h+='</tr>';}
      out.push(h+'</tbody></table>');continue;
    }
    if(/^\s*[-*]\s/.test(L)){
      var ul='<ul>';
      while(i<lines.length&&/^\s*[-*]\s/.test(lines[i])){ul+='<li>'+mdIn(lines[i].replace(/^\s*[-*]\s/,''))+'</li>';i++;}
      out.push(ul+'</ul>');continue;
    }
    if(/^\s*\d+\.\s/.test(L)){
      var ol='<ol>';
      while(i<lines.length&&/^\s*\d+\.\s/.test(lines[i])){ol+='<li>'+mdIn(lines[i].replace(/^\s*\d+\.\s/,''))+'</li>';i++;}
      out.push(ol+'</ol>');continue;
    }
    if(L.trim()===''){i++;continue;}
    var p=[L];i++;
    while(i<lines.length&&lines[i].trim()!==''&&!/^[#|`\-\*\d]/.test(lines[i])){p.push(lines[i]);i++;}
    out.push('<p>'+mdIn(p.join(' '))+'</p>');
  }
  return out.join('');
}
function mdIn(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  return s;
}

/* ---------- Pyodide (Python real en el navegador) ---------- */
function loadPy(){
  if(PYSTATE)return;
  PYSTATE=1;
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js';
  s.onload=function(){
    PYSTATE=2;
    window.loadPyodide({stdout:function(t){logOut(t);},stderr:function(t){logOut(t,true);}}).then(function(p){PY=p;PYSTATE=3;refreshBadge();});
  };
  s.onerror=function(){PYSTATE=4;refreshBadge();};
  document.head.appendChild(s);
}
function logOut(t,err){
  var boxes=document.querySelectorAll('.out');
  var last=boxes[boxes.length-1];
  if(last){last.textContent+=t;if(err)last.style.color='#f85149';}
}
function pyStatus(){
  if(PYSTATE===3)return '<span class="pybadge"><span style="color:#3fb950">&#9679;</span> Python real activo</span>';
  if(PYSTATE===2)return '<span class="pybadge"><span class="spin"></span> Cargando Python...</span>';
  if(PYSTATE===4)return '<span class="pybadge"><span style="color:#d29922">&#9679;</span> Python offline - modo comparación</span>';
  return '<span class="pybadge"><span style="color:#8b98a9">&#9679;</span> Python no cargado</span>';
}

  out.textContent='(Python real requiere internet. Cargando...)\n';
  PYSTATE=1;loadPy();
  var iv=setInterval(function(){
    if(PYSTATE===3){clearInterval(iv);runPy(lid,tid,ei,code);}
    else if(PYSTATE===4){clearInterval(iv);out.textContent='No hay internet: no se puede ejecutar Python real.\nUsa "Ver respuesta" o tu editor local.';
      document.getElementById('f'+lid+'_'+tid+'_'+ei).innerHTML='<div class="warn">Sin conexion. Instala Python y corre <code>python python_learn.py</code></div>';}
  },350);
}
function award(lid,tid){
  if(S.done.indexOf(ky(lid,tid))===-1){S.done.push(ky(lid,tid));S.score+=5;S.streak++;sv();hud();nav();}
}
function norm(s){return String(s).replace(/\s+/g,' ').replace(/["']/g,'"').replace(/\)\s*$/,'').trim().toLowerCase();}
function kws(s){return String(s).replace(/["']/g,' ').replace(/[^a-zA-Z0-9_ ]/g,' ').split(/\s+/).filter(function(w){return w.length>2;});}
function cmp(lid,tid,ei){
  var t=tp(COURSE[lid])[tid],ex=t.exercises[ei];
  var u=document.getElementById('c'+lid+'_'+tid+'_'+ei).value;
  var fb=document.getElementById('f'+lid+'_'+tid+'_'+ei);
  var out=document.getElementById('o'+lid+'_'+tid+'_'+ei);
  if(!u.trim()){fb.innerHTML='<div class="no">Escribe algo primero</div>';return;}
  var a=norm(ex.answer),b=norm(u),K=kws(ex.answer),U=kws(u);
  var hit=K.filter(function(w){return U.indexOf(w)>-1;}).length;
  var good=(a===b)||(a.indexOf(b)===0&&b.length>6)||(hit>=Math.max(1,Math.ceil(K.length*0.7)));
  if(good){
    fb.innerHTML='<div class="ok">&#10004; ¡Correcto! +5 puntos</div>';
    if(out&&PYSTATE!==3){out.textContent='(respuesta correcta)';}
    award(lid,tid);
  }else{
    fb.innerHTML='<div class="no">&#10007; Casi. Revisa la pista e intentalo de nuevo.</div>';
  }
}
function reveal(lid,tid,ei){
  var t=tp(COURSE[lid])[tid],ex=t.exercises[ei];
  document.getElementById('f'+lid+'_'+tid+'_'+ei).innerHTML='<div class="hint" style="margin-top:10px"><b>Respuesta:</b></div><pre><code>'+esc(ex.answer)+'</code></pre>';
}

/* ---------- render ---------- */
function hud(){
  document.getElementById('hS').textContent=S.score;
  document.getElementById('hK').textContent=S.streak;
  var it=items();document.getElementById('hD').textContent=S.done.length+'/'+it.length;
  document.getElementById('pf').style.width=(S.done.length/it.length*100)+'%';
}
function nav(){
  var h='';
  SECS.forEach(function(s){
    var n=0,dn=0;
    s.ls.forEach(function(id){var t=tp(COURSE[id]);n+=t.length;for(var i=0;i<t.length;i++)if(done(id,i))dn++;});
    h+='<div class="sec"><h3><span>'+esc(s.n)+'</span><span>'+dn+'/'+n+'</span></h3>';
    s.ls.forEach(function(id){
      var l=COURSE[id],t=tp(l),d=t.every(function(x,i){return done(id,i);});
      h+='<a href="#" data-g="1" data-id="'+id+'"><span class="dot'+(d?' d':'')+(l.type==='PROJECT_GUIDED'?' p':'')+'"></span><span>'+id+'. '+esc(l.title)+'</span></a>';
    });
    h+='</div>';
  });
  document.getElementById('sl').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('#sl a'),function(a){
    a.onclick=function(e){e.preventDefault();lesson(a.dataset.id);};
  });
}
function home(){
  document.getElementById('ttl').textContent='Python Learn';
  var it=items(),p=S.done.length,r=Math.round(p/it.length*100);
  var q=0;Object.keys(QUIZ).forEach(function(k){q+=QUIZ[k].length;});
  document.getElementById('bd').innerHTML =
   '<div class="hero"><div style="font-size:60px">&#128045;</div><h2>Python Learn</h2>'+
   '<p>Curso interactivo de Python, gratis y en tu navegador</p>'+
   '<p style="color:#22d3ee;font-weight:600">'+it.length+' temas &middot; 90 lecciones &middot; '+q+' preguntas &middot; 14 proyectos</p>'+
   '<br><button class="btn" onclick="next()">&#9654; Empezar a aprender</button>'+
   (p?'<p style="margin-top:16px;font-size:14px">Progreso: '+p+'/'+it.length+' ('+r+'%)</p>':'')+
   '<div class="nav" style="justify-content:center;margin-top:26px">'+
   '<button class="btn2" onclick="startPy()">&#9881; Activar Python real</button>'+
   '<button class="btn2" onclick="cert()">&#127942; Certificado</button></div>'+
   '<p style="margin-top:22px;font-size:12px;color:#6e7b8c">Inspirado en Mimo &middot; funciona sin internet (con limites)</p></div>';
  nav();hud();
}
function startPy(){
  home();
  loadPy();
  setTimeout(function(){
    var f=document.getElementById('bd');
    if(f&&!f.querySelector('.pybadge'))f.insertAdjacentHTML('afterbegin','<div class="card" id="pyb">'+pyStatus()+'</div>');
    refreshBadge();
  },50);
}
function lesson(id){
  var l=COURSE[id],t=tp(l);
  document.getElementById('ttl').textContent=l.title;
  var h='div class="card"><h3>'+id+'. '+esc(l.title)+'</h3><div>'+bdg(l)+'</div>'+
        (l.project_code?'<p style="color:#8b98a9;font-size:13px;margin-top:9px">Este tema tiene codigo de proyecto completo</p>':'')+'</div><div class="grid">';
  t.forEach(function(x,i){
    h+='<div class="tc'+(done(id,i)?' ok':'')+'" onclick="topic(\''+id+'\','+i+')"><div class="n">'+(done(id,i)?'&#10004;':(i+1))+'</div><div class="t">'+esc(x.title)+'</div></div>';
  });
  h+='</div><div class="nav"><button class="btn" onclick="next()">Continuar &#9654;</button><button class="btn2" onclick="home()">Inicio</button></div>';
  document.getElementById('bd').innerHTML=h;nav();hud();
}
function topic(lid,tid){
  var l=COURSE[lid],t=tp(l)[tid];
  document.getElementById('ttl').textContent=t.title;
  var qi=(QUIZ[lid]||[]).map(function(q,k){return {q:q,i:k};});
  var h='<div class="tabs"><button class="tab on" id="t0" onclick="tab(0)">&#128218; Teoria</button>'+
        '<button class="tab" id="t1" onclick="tab(1)">&#9998; Programar</button>'+
        '<button class="tab" id="t2" onclick="tab(2)">&#10067; Quiz ('+qi.length+')</button></div>';

  h+='<div class="pane on" id="p0"><div class="card"><h3>'+esc(l.title)+'</h3><div>'+bdg(l)+' &middot; Tema '+(tid+1)+'</div></div>'+
     '<div class="card md">'+(THEORY[lid]?'<h2>'+esc(t.title)+'</h2>'+md(THEORY[lid]):'<p>'+esc(t.title)+'</p>')+'</div>'+
     '<div class="nav"><button class="btn" onclick="tab(1)">Practicar ahora &#9654;</button></div></div>';

  h+='<div class="pane" id="p1"><div class="card" id="pyb">'+pyStatus()+' <button class="gh" onclick="loadPy()">Activar / recargar</button></div>';
  if(t.description)h+='<div class="card" style="color:#8b98a9;font-size:14px">'+esc(t.description)+'</div>';
  if(l.project_code)h+='<div class="card"><h3>Codigo del proyecto</h3><div class="md"><pre><code>'+esc(l.project_code)+'</code></pre></div></div>';
  (t.exercises||[]).forEach(function(ex,ei){
    h+='<div class="ex"><div class="q">Ejercicio '+(ei+1)+'</div>'+
       '<div class="md"><pre><code>'+esc(ex.question)+'</code></pre></div>'+
       '<div class="hint"><b>&#128161; Pista:</b> '+esc(ex.hint)+'</div>'+
       '<textarea id="c'+lid+'_'+tid+'_'+ei+'" placeholder="Escribe tu codigo Python aqui..."></textarea>'+
       '<div class="out" id="o'+lid+'_'+tid+'_'+ei+'" style="color:#7ee787">La salida aparecera aqui.</div>'+
       '<div class="row"><button class="btn" onclick="runPy('+lid+','+tid+','+ei+',document.getElementById(\'c'+lid+'_'+tid+'_'+ei+'\').value)">&#9654; Ejecutar</button>'+
       '<button class="btn2" onclick="cmp('+lid+','+tid+','+ei+')">&#10004; Comprobar</button>'+
       '<button class="gh" onclick="reveal('+lid+','+tid+','+ei+')">Ver respuesta</button></div>'+
       '<div id="f'+lid+'_'+tid+'_'+ei+'"></div></div>';
  });
  h+='<div class="nav">';
  if(tid>0)h+='<button class="gh" onclick="topic(\''+lid+'\','+(tid-1)+')">&#8592; Tema anterior</button>';
  h+='<button class="btn2" onclick="tab(0)">&#128218; Ver teoria</button>'+
     '<button class="btn" onclick="after(\''+lid+'\','+tid+')">Marcar y continuar &#9654;</button></div></div>';

  h+='<div class="pane" id="p2">';
  if(!qi.length)h+='<div class="card">Sin preguntas para este tema.</div>';
  else{
    h+='<div class="card" style="color:#8b98a9;font-size:13.5px">Responde las preguntas de opcion multiple. Puntaje: 2 por acierto.</div>';
    qi.forEach(function(z){
      h+='<div class="qz"><div class="qq">'+(z.i+1)+'. '+esc(z.q[0])+'</div><div class="opts" id="o'+lid+'_'+z.i+'">';
      z.q[1].forEach(function(o,k){
        h+='<button class="opt" onclick="pick('+lid+','+z.i+','+k+','+z.q[2]+')">'+String.fromCharCode(65+k)+') '+esc(o)+'</button>';
      });
      h+='</div><div id="qf'+lid+'_'+z.i+'"></div></div>';
    });
    h+='<div class="card" style="text-align:center"><b>Quiz de esta leccion</b><div id="qz'+lid+'" style="margin-top:8px;color:#3fb950;font-weight:700"></div></div>';
  }
  h+='</div>';
  document.getElementById('bd').innerHTML=h;
  nav();hud();
}
function tab(n){
  for(var i=0;i<3;i++){
    document.getElementById('t'+i).className='tab'+(i===n?' on':'');
    var p=document.getElementById('p'+i);if(p)p.className='pane'+(i===n?' on':'');
  }
  document.getElementById('bd').scrollTop=0;
}
function pick(lid,qi,k,correct){
  var box=document.getElementById('o'+lid+'_'+qi);
  var btns=box.querySelectorAll('.opt');
  Array.prototype.forEach.call(btns,function(b){b.disabled=true;});
  if(k===correct){
    btns[k].className='opt right';
    var kk=ky(lid,qi)+'q';
    if(S.qok.indexOf(kk)===-1){S.qok.push(kk);S.score+=2;sv();hud();}
    document.getElementById('qf'+lid+'_'+qi).innerHTML='<div class="ok">&#10004; Correcto! +2 puntos</div>';
    var n=0;for(var z=0;z<(QUIZ[lid]||[]).length;z++){var f=document.getElementById('qf'+lid+'_'+z);if(f&&f.innerHTML)n++;}
    document.getElementById('qz'+lid).textContent=n+'/'+(QUIZ[lid]||[]).length+' correctas';
    if(n===(QUIZ[lid]||[]).length){award(lid,0);document.getElementById('qz'+lid).innerHTML+=' &#127942; Tema completo!';}
  }else{
    btns[k].className='opt wrong';
    btns[correct].className='opt right';
    document.getElementById('qf'+lid+'_'+qi).innerHTML='<div class="no">&#10007; Incorrecto. La correcta es '+String.fromCharCode(65+correct)+'.</div>';
  }
}
function next(){
  var it=items();
  for(var i=0;i<it.length;i++){if(!done(it[i].l,it[i].i)){topic(it[i].l,it[i].i);return;}}
  cert();
}
function after(lid,tid){
  award(lid,tid);
  var t=tp(COURSE[lid]);
  if(tid+1<t.length){topic(lid,tid+1);return;}
  var ids=Object.keys(COURSE).sort(function(a,b){return a-b;});
  var p=ids.indexOf(String(lid));
  if(p>-1&&p+1<ids.length){lesson(ids[p+1]);return;}
  cert();
}
function cert(){
  var it=items(),n=it.length,p=S.done.length;
  document.getElementById('ttl').textContent='Certificado';
  if(p<n){
    document.getElementById('bd').innerHTML='<div class="cert"><h2>&#127942; Todavia no</h2><p>Completa los '+n+' temas para obtener tu certificado</p><p style="color:#22d3ee;font-size:21px;font-weight:700">'+p+' / '+n+' ('+Math.round(p/n*100)+'%)</p><div class="nav" style="justify-content:center"><button class="btn" onclick="next()">Continuar aprendiendo</button></div></div>';
    nav();hud();return;
  }
  var d=new Date().toLocaleDateString('es');
  document.getElementById('bd').innerHTML='<div class="cert"><div style="font-size:52px">&#127942;</div><h2>Certificado de Finalizacion</h2><p>Se otorga a</p><h2 style="font-size:22px;color:#fff;margin:12px 0">&#128100; Crico719</h2><p>por completar el curso de <b style="color:#22d3ee">Python Learn</b></p><p>'+n+' temas &middot; 90 lecciones &middot; '+d+'</p><p style="margin-top:16px;font-size:12px">Puntaje final: '+S.score+' puntos</p><div class="nav" style="justify-content:center"><button class="gh" onclick="if(confirm(\'Borrar progreso?\')){S={done:[],qok:[],score:0,streak:0};sv();home();}">Reiniciar progreso</button></div></div>';
  nav();hud();
}
ld();home();
</script>
</body>
</html>
