<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python Learn - Curso Interactivo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--p:#161b22;--p2:#1c2431;--l:#2b3646;--t:#e6edf3;--d:#8b98a9;--c:#22d3ee;--g:#3fb950;--y:#d29922;--r:#f85149;--v:#a371f7}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
button{font-family:inherit;cursor:pointer}
#lay{display:flex;min-height:100vh}
aside{width:288px;flex-shrink:0;background:var(--p);border-right:1px solid var(--l);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.br{padding:18px;border-bottom:1px solid var(--l);text-align:center}
.br .lg{font-size:38px}.br h1{font-size:19px;color:var(--c)}.br small{color:var(--d);font-size:11px}
.hud{display:grid;grid-template-columns:repeat(3,1fr);padding:12px;background:var(--p2);border-bottom:1px solid var(--l);text-align:center}
.hud b{display:block;font-size:17px;color:var(--c)}.hud span{font-size:10px;color:var(--d)}
#sl{flex:1;overflow-y:auto;padding:6px}
.sec{border-bottom:1px solid var(--l);padding:6px 8px}
.sec h3{font-size:11px;color:var(--d);text-transform:uppercase;letter-spacing:.4px;margin:5px 0;display:flex;justify-content:space-between}
.sec a{display:flex;gap:7px;align-items:center;padding:6px 8px;border-radius:5px;color:var(--t);text-decoration:none;font-size:12.5px}
.sec a:hover{background:var(--p2)}.sec a.on{background:#1f6feb33;border-left:3px solid var(--c)}
.dot{width:8px;height:8px;border-radius:50%;background:#30363d;flex-shrink:0}
.dot.d{background:var(--g)}.dot.p{background:var(--y)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--l);background:var(--p);position:sticky;top:0;z-index:9}
#top h2{font-size:17px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh{background:transparent;border:1px solid var(--l);color:var(--d);padding:6px 12px;border-radius:6px;font-size:12.5px;white-space:nowrap}
.gh:hover{border-color:var(--c);color:var(--c)}
.bar{height:4px;background:var(--p2)}.bar div{height:100%;background:linear-gradient(90deg,var(--c),var(--g));transition:width .4s}
#bd{flex:1;padding:20px;max-width:1000px;width:100%;margin:0 auto}
.hero{text-align:center;padding:60px 18px}
.hero h2{font-size:36px;color:var(--c)}.hero p{color:var(--d);margin:9px 0}
.btn{background:linear-gradient(135deg,#22d3ee,#0ea5e9);border:0;color:#04222a;font-weight:700;padding:12px 30px;border-radius:9px;font-size:15px}
.btn:hover{filter:brightness(1.1)}
.btn2{background:var(--p2);border:1px solid var(--l);color:var(--t);font-weight:600;padding:11px 26px;border-radius:9px;font-size:15px}
.btn2:hover{border-color:var(--c)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--l);margin-bottom:18px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--d);padding:10px 15px;font-size:14px;font-weight:600}
.tab.on{color:var(--c);border-bottom-color:var(--c)}
.pane{display:none}.pane.on{display:block}
.card{background:var(--p);border:1px solid var(--l);border-radius:11px;padding:18px;margin-bottom:14px}
.card h3{font-size:18px;margin-bottom:5px}
.md{line-height:1.75;font-size:14.5px}
.md h2{font-size:20px;color:var(--c);margin:0 0 12px}
.md h3{font-size:16px;color:#fff;margin:18px 0 7px}
.md p{margin:9px 0}
.md ul,.md ol{margin:9px 0 9px 22px}
.md li{margin:4px 0}
.md b{color:#fff}
.md code{background:#010409;border:1px solid var(--l);border-radius:4px;padding:1.5px 6px;font-family:Consolas,Monaco,monospace;font-size:12.5px;color:#7ee787}
.md pre{background:#010409;border:1px solid var(--l);border-radius:9px;padding:14px;overflow-x:auto;margin:11px 0}
.md pre code{background:none;border:0;padding:0;color:#7ee787;font-size:13px;line-height:1.6}
.md table{border-collapse:collapse;width:100%;margin:11px 0;font-size:13px}
.md th,.md td{border:1px solid var(--l);padding:7px 10px;text-align:left}
.md th{background:var(--p2);color:var(--c)}
.md strong{color:#fff}
.ex{background:var(--p2);border-left:3px solid var(--c);border-radius:0 9px 9px 0;padding:14px;margin:12px 0}
.ex .q{font-weight:600;margin-bottom:9px}
.hint{color:var(--y);font-size:12.5px;margin-top:8px}
textarea{width:100%;background:#010409;color:#7ee787;border:1px solid var(--l);border-radius:8px;padding:11px;font-family:Consolas,Monaco,monospace;font-size:13px;min-height:110px;resize:vertical}
textarea:focus{outline:none;border-color:var(--c)}
.out{background:#010409;border:1px solid var(--l);border-radius:8px;padding:12px;margin-top:10px;font-family:Consolas,Monaco,monospace;font-size:13px;white-space:pre-wrap;max-height:300px;overflow-y:auto;min-height:34px}
.ok{color:var(--g);font-weight:600;margin-top:8px}.no{color:var(--r);font-weight:600;margin-top:8px}.warn{color:var(--y);font-weight:600;margin-top:8px}
.row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;align-items:center}
.qz{background:var(--p);border:1px solid var(--l);border-radius:11px;padding:16px;margin-bottom:12px}
.qz .qq{font-weight:600;margin-bottom:11px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{background:var(--p2);border:1px solid var(--l);border-radius:8px;padding:10px 13px;text-align:left;color:var(--t);font-size:14px}
.opt:hover:not(:lock){border-color:var(--c)}
.opt.right{border-color:var(--g);background:#1a472233;color:var(--g)}
.opt.wrong{border-color:var(--r);background:#4d1f2133;color:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tc{background:var(--p2);border:1px solid var(--l);border-radius:9px;padding:14px;text-align:center}
.tc:hover{border-color:var(--c)}.tc.ok{border-color:var(--g)}
.tc .n{font-size:18px;font-weight:700;color:var(--c)}.tc.ok .n{color:var(--g)}
.tc .t{font-size:12px;color:var(--d);margin-top:4px}
.nav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.cert{text-align:center;padding:40px;background:linear-gradient(135deg,#161b22,#1f2937);border:2px solid var(--y);border-radius:13px}
.cert h2{color:var(--y);font-size:26px}.cert p{color:var(--d);margin:8px 0}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600}
.bL{background:#1f4b7355;color:#58a6ff}.bP{background:#2d6a3555;color:var(--g)}.bG{background:#6b4a1455;color:var(--y)}
.pybadge{font-size:11px;color:var(--d);display:flex;align-items:center;gap:6px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--l);border-top-color:var(--c);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:820px){#lay{flex-direction:column}aside{width:100%;height:auto;position:relative}#sl{max-height:190px}#bd{padding:14px}.hero h2{font-size:25px}}
</style>
</head>
<body>
<div id="lay">
<aside>
  <div class="br"><div class="lg">&#128045;</div><h1>Python Learn</h1><small>Curso interactivo gratuito</small></div>
  <div class="hud">
    <div><b id="hS">0</b><span>&#11088; Puntos</span></div>
    <div><b id="hD">0</b><span>&#128218; Temas</span></div>
    <div><b id="hK">0</b><span>&#128293; Racha</span></div>
  </div>
  <div id="sl"></div>
</aside>
<main>
  <div id="top">
    <button class="gh" onclick="home()">&#127968; Inicio</button>
    <h2 id="ttl">Python Learn</h2>
    <button class="gh" onclick="cert()">&#127942; Certificado</button>
  </div>
  <div class="bar"><div id="pf" style="width:0%"></div></div>
  <div id="bd"></div>
</main>
</div>
<script>
var COURSE={"1": {"title": "Creating variables", "exercises": [{"question": "Create a variable 'name' with your name and print it", "answer": "name = \"Ana\"\nprint(name)", "hint": "Use assignment and print()"}], "topics": [{"title": "Nombres de variables", "description": "Elige nombres descriptivos para tus variables", "exercises": [{"question": "name = \"Ana\"\nprint(name)", "answer": "Use meaningful variable names", "hint": "Follow Python naming rules"}]}, {"title": "Valores de variables", "description": "Asigna diferentes tipos de datos", "exercises": [{"question": "age = 25\nheight = 1.70\nprint(age, height)", "answer": "Assign int, float, string", "hint": "Each variable holds one value"}]}, {"title": "Consola", "description": "Usa print() para mostrar valores", "exercises": [{"question": "print(\"Hello World\")", "answer": "Use print() function", "hint": "Text must be inside quotes"}]}]}, "2": {"title": "Using variables", "exercises": [{"question": "Create a=5 and b=3, print sum and difference", "answer": "a = 5\nb = 3\nprint(a + b)\nprint(a - b)", "hint": "Assign then use + and -"}], "topics": [{"title": "Operaciones con variables", "description": "Suma, resta, multiplica y divide", "exercises": [{"question": "a = 10\nb = 3\nprint(a + b, a - b, a * b, a / b)", "answer": "Use + - * / operators", "hint": "Operators work like math"}]}, {"title": "Reasignación", "description": "Cambia el valor de una variable", "exercises": [{"question": "x = 5\nx = 10\nprint(x)", "answer": "Just assign a new value", "hint": "Variables can change"}]}]}, "3": {"title": "True and False", "exercises": [{"question": "Create a boolean 'is_raining' and print it", "answer": "is_raining = True\nprint(is_raining)", "hint": "Use True or False"}], "topics": [{"title": "Verdadero y falso", "description": "Entiende los valores booleanos", "exercises": [{"question": "is_active = True\nprint(is_active)", "answer": "Use True or False (capital)", "hint": "Only two possible values"}]}, {"title": "Comparaciones booleanas", "description": "Compara valores para obtener True/False", "exercises": [{"question": "print(5 > 3)\nprint(5 == 5)\nprint(5 != 3)", "answer": "Use >, ==, != operators", "hint": "Comparison returns True or False"}]}]}, "4": {"title": "Equality and verification", "exercises": [{"question": "Check if 10 equals 10", "answer": "print(10 == 10)", "hint": "Use == for equality"}], "topics": [{"title": "Igualdad", "description": "Compara si dos valores son iguales", "exercises": [{"question": "print(10 == 10)\nprint(10 == 5)", "answer": "Use == for equality", "hint": "Double equals sign"}]}, {"title": "Desigualdad", "description": "Compara si valores son diferentes", "exercises": [{"question": "print(10 != 5)\nprint(10 != 10)", "answer": "Use != for inequality", "hint": "Not equal operator"}]}, {"title": "Mayor y menor", "description": "Compara tamaño de valores", "exercises": [{"question": "print(5 > 3)\nprint(3 < 5)\nprint(5 >= 5)", "answer": "Use >, <, >=, <=", "hint": "Greater than, less than operators"}]}]}, "5": {"title": "Format strings", "exercises": [{"question": "Create fruit variable, print 'I love <fruit>'", "answer": "fruit = \"apple\"\nprint(f\"I love {fruit}\")", "hint": "Use f-string"}], "topics": [{"title": "F-strings", "description": "Inserta variables dentro de texto", "exercises": [{"question": "name = \"Ana\"\nprint(f\"Hello {name}\")", "answer": "Use f before the string", "hint": "Curly braces {} hold variables"}]}, {"title": "Métodos de texto", "description": "Transforma strings con métodos", "exercises": [{"question": "text = \"hello\"\nprint(text.upper())\nprint(text.capitalize())", "answer": "Use .upper(), .lower(), .capitalize()", "hint": "Methods come after dot"}]}]}, "6": {"title": "Python basics", "exercises": [{"question": "Create name, age, city and print formatted", "answer": "name = \"Ana\"\nage = 25\ncity = \"Lima\"\nprint(f\"I am {name}, {age} from {city}\")", "hint": "Use f-strings"}], "type": "PRACTICE", "topics": [{"title": "Tipos de datos", "description": "Identifica int, float, bool, str", "exercises": [{"question": "print(type(10))\nprint(type(3.14))\nprint(type(True))\nprint(type(\"text\"))", "answer": "Use type() function", "hint": "Each type is different"}]}, {"title": "Conversiones", "description": "Convierte entre tipos de datos", "exercises": [{"question": "print(int(\"5\"))\nprint(float(3))\nprint(str(10))", "answer": "Use int(), float(), str()", "hint": "Convert between types"}]}, {"title": "Consolidación", "description": "Practica todos los conceptos básicos", "exercises": [{"question": "name = \"Ana\"\nage = 25\nprint(f\"{name} is {age}\")", "answer": "Combine all concepts", "hint": "Practice makes perfect"}]}]}, "7": {"title": "Bot - Part 1", "exercises": [{"question": "Build a bot that greets the user", "answer": "name = input(\"What is your name? \")\nprint(f\"Hello, {name}! Nice to meet you!\")\nprint(\"I am your Python bot. How can I help?\")", "hint": "Use input() and f-string"}], "type": "PROJECT_GUIDED", "project_part": 1, "project_code": "print('Bot: Hello!')\nname = input('Bot: What is your name? ')\nprint(f'Bot: Nice to meet you, {name}!')\nprint('I am your Python bot. How can I help?')\n", "topics": [{"title": "Saludo del bot", "description": "Crea un bot que saluda", "exercises": [{"question": "name = input(\"What is your name? \")\nprint(f\"Hello, {name}!\")", "answer": "Use input() and f-string", "hint": "input() gets user text"}]}, {"title": "Interacción básica", "description": "Haz que el bot responda", "exercises": [{"question": "name = input(\"Name: \")\nprint(f\"Nice to meet you, {name}!\")\nprint(\"I am your Python bot.\")", "answer": "Multiple print() calls", "hint": "Build a conversation flow"}]}]}, "8": {"title": "Comparing numbers", "exercises": [{"question": "Check if number is positive, negative, or zero", "answer": "num = int(input(\"Num: \"))\nif num > 0:\n    print(\"Positive\")\nelif num < 0:\n    print(\"Negative\")\nelse:\n    print(\"Zero\")", "hint": "Use if/elif/else"}]}, "9": {"title": "Comparing strings", "exercises": [{"question": "Ask for name, check if 'Ana'", "answer": "name = input(\"Your name: \")\nif name.lower() == \"ana\":\n    print(\"Hello Ana!\")\nelse:\n    print(f\"Hello {name}!\")", "hint": "Use .lower()"}]}, "10": {"title": "Discovering types", "exercises": [{"question": "Create vars of each type and print types", "answer": "x=10; y=\"hello\"; z=3.14; w=True\nprint(type(x)); print(type(y)); print(type(z)); print(type(w))", "hint": "Use type() function"}]}, "11": {"title": "Types and comparisons", "exercises": [{"question": "Ask two numbers, convert, print larger", "answer": "a = int(input(\"First: \")); b = int(input(\"Second: \"))\nif a > b: print(f\"{a} larger\")\nelif b > a: print(f\"{b} larger\")\nelse: print(\"Equal\")", "hint": "Use int() to convert"}], "type": "PRACTICE"}, "12": {"title": "Input", "exercises": [{"question": "Ask name and age, print greeting", "answer": "name = input(\"Your name: \")\nage = int(input(\"Your age: \"))\nprint(f\"Hello {name}! You are {age}.\"", "hint": "Use input() and f-string"}]}, "13": {"title": "Bot - Part 2", "exercises": [{"question": "Build interactive bot conversation", "answer": "print(\"Bot: Hello!\")\nname = input(\"Bot: What is your name? \")\nprint(f\"Bot: Nice to meet you, {name}!\")\nmood = input(\"Bot: How are you? \")\nif mood.lower() == \"good\":\n    print(\"Bot: Great!\")\nelse:\n    print(\"Bot: Hope you feel better!\")\nprint(f\"Bot: Goodbye {name}!\")", "hint": "Use input() and if/else"}], "type": "PROJECT_GUIDED", "project_part": 2, "project_code": "print('Bot: Hello!')\nname = input('Bot: What is your name? ')\nprint(f'Bot: Nice to meet you, {name}!')\nmood = input('Bot: How are you? ')\nif mood.lower() == 'good':\n    print('Bot: Great!')\nelse:\n    print('Bot: Hope you feel better!')\nprint(f'Bot: Goodbye {name}!')\n"}, "14": {"title": "Decision making", "exercises": [{"question": "Check if number is even or odd", "answer": "num = int(input(\"Num: \"))\nif num % 2 == 0:\n    print(\"Even\")\nelse:\n    print(\"Odd\")", "hint": "Use % modulo"}]}, "15": {"title": "Using conditions", "exercises": [{"question": "Check multiple criteria", "answer": "age = int(input(\"Age: \"))\nif age >= 18 and age < 65:\n    print(\"Working adult\")\nelif age >= 65:\n    print(\"Senior\")\nelse:\n    print(\"Minor\")", "hint": "Use and/or"}]}, "16": {"title": "Conditional statements 1", "exercises": [{"question": "Write access level checker", "answer": "level = input(\"Level (admin/user): \")\nif level.lower() == \"admin\":\n    print(\"Full access\")\nelse:\n    print(\"Limited access\")", "hint": "Use if/else with strings"}], "type": "PRACTICE"}, "17": {"title": "Coding Else statements", "exercises": [{"question": "Create calculator with if/elif/else", "answer": "op = input(\"Op (+,-,*,/): \")\na = float(input(\"A: \")); b = float(input(\"B: \"))\nif op == \"+\": print(a+b)\nelif op == \"-\": print(a-b)\nelif op == \"*\": print(a*b)\nelse: print(a/b)", "hint": "Chain if/elif/else"}]}, "18": {"title": "Adding Elif", "exercises": [{"question": "Create grading system", "answer": "score = int(input(\"Score: \"))\nif score >= 90: print(\"A\")\nelif score >= 80: print(\"B\")\nelif score >= 70: print(\"C\")\nelse: print(\"F\")", "hint": "Use elif for ranges"}]}, "19": {"title": "Using complex decisions", "exercises": [{"question": "Combine and/or/not", "answer": "temp = int(input(\"Temp: \")); rain = input(\"Rain? (yes/no): \")\nif temp > 30 and rain.lower() != \"yes\":\n    print(\"Hot and sunny!\")\nelif temp < 10 or rain.lower() == \"yes\":\n    print(\"Cold or rainy\")\nelse:\n    print(\"Pleasant\")", "hint": "Combine and/or/not"}]}, "20": {"title": "Conditional statements 2", "exercises": [{"question": "Create login checker", "answer": "user = input(\"Username: \"); p = input(\"Password: \")\nif user == \"admin\" and p == \"1234\":\n    print(\"Access granted\")\nelse:\n    print(\"A
